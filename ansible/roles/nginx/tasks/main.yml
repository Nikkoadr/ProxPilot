---
- name: Create web root directory
  file:
    path: /var/www/landing
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy landing page
  copy:
    src: index.html
    dest: /var/www/landing/index.html
    owner: root
    group: root
    mode: '0644'

- name: Deploy nginx configuration
  template:
    src: default.conf.j2
    dest: /etc/nginx/sites-available/default
    owner: root
    group: root
    mode: '0644'
  notify: restart nginx

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  ignore_errors: yes
  notify: restart nginx

- name: Start and enable nginx
  service:
    name: nginx
    state: started
    enabled: yes
