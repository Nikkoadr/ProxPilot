---
# Persiapan khusus master. OS prep umum (swap/modul/sysctl) ada di role
# `common` agar worker ikut dapat. Init control-plane ada di init.yml
# (di-include di bawah, hanya master pertama — sisanya join manual/HA).
- name: Update hosts file
  lineinfile:
    path: /etc/hosts
    line: "{{ hostvars[inventory_hostname]['ansible_default_ipv4']['address'] }} {{ inventory_hostname }}"
    state: present
  when: hostvars[inventory_hostname]['ansible_default_ipv4']['address'] is defined

- name: Initialize control plane (first master only)
  include_tasks: init.yml
  when: inventory_hostname == (groups['k8s_master'] | first)
