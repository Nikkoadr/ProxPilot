---
# Di-include dari role master, HANYA di master pertama
# (when: inventory_hostname == groups['k8s_master'] | first).
# Master tambahan tidak diinit (join control-plane HA manual, di luar scope).
- name: Initialize Kubernetes cluster
  command: kubeadm init --pod-network-cidr={{ pod_network_cidr }} --token-ttl=0
  args:
    creates: /etc/kubernetes/admin.conf
  become: yes

- name: Create .kube directory
  file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  become: yes

- name: Copy admin.conf to user kube config
  copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: yes
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  become: yes

- name: Install Calico CNI
  command: kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.27.0/manifests/calico.yaml
  become: yes
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Write join command on master
  shell: kubeadm token create --print-join-command > /tmp/k8s-join.sh && chmod 700 /tmp/k8s-join.sh
  become: yes

- name: Fetch join command to controller
  fetch:
    src: /tmp/k8s-join.sh
    dest: /tmp/k8s-join.sh
    flat: yes
