<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProxPilot — Configure</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="page">
<aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
  <div class="container-fluid">
    <a href="/" class="navbar-brand"><strong>ProxPilot</strong></a>
    <div class="collapse navbar-collapse" id="sidebar-menu">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="/setup"><span class="nav-link-icon"><i class="ti ti-plug"></i></span>Setup</a></li>
        <li class="nav-item"><a class="nav-link" href="/clone"><span class="nav-link-icon"><i class="ti ti-copy"></i></span>Clone VM</a></li>
        <li class="nav-item"><a class="nav-link active" href="/configure"><span class="nav-link-icon"><i class="ti ti-settings"></i></span>Configure</a></li>
        <li class="nav-item"><a class="nav-link" href="/settings"><span class="nav-link-icon"><i class="ti ti-user-cog"></i></span>Settings</a></li>
      </ul>
    </div>
  </div>
</aside>
<div class="page-wrapper">
  <header class="navbar navbar-expand-md d-print-none">
    <div class="container-xl">
      <h1 class="navbar-brand">Configure (Ansible)</h1>
      <div class="navbar-nav ms-auto">
        <span class="nav-link text-muted">{{.User}}</span>
        <a href="#" id="btnLogout" class="nav-link"><i class="ti ti-logout"></i> Logout</a>
      </div>
    </div>
  </header>
  <div class="page-body"><div class="container-xl">
    <div class="card mb-3"><div class="card-header d-flex justify-content-between">
      <h3 class="card-title">1 — Pilih VM (<span id="vmCount">0 dipilih</span>)</h3>
      <div><button id="btnAll" class="btn btn-outline-primary btn-sm">Semua</button>
      <button id="btnNone" class="btn btn-outline-secondary btn-sm ms-1">Hapus</button></div></div>
      <div class="table-responsive"><table class="table table-vcenter">
        <thead><tr><th></th><th>VMID</th><th>Nama</th><th>Status</th><th>CPU/Mem</th><th>Uptime</th></tr></thead>
        <tbody id="vmRows"><tr><td colspan="6" class="text-muted">loading...</td></tr></tbody>
      </table></div>
    </div>
    <div class="card mb-3"><div class="card-header"><h3 class="card-title">2 — Pilih Template</h3></div>
      <div class="card-body"><div id="tplRows" class="row"><div class="text-muted">loading...</div></div></div></div>
    <div class="card mb-3"><div class="card-header"><h3 class="card-title">3 — Jalankan</h3></div>
      <div class="card-body">
        <div class="row align-items-end">
          <div class="col-md-3"><label class="form-label">SSH User</label>
            <select id="sshUser" class="form-select">
              <option>ubuntu</option><option>root</option><option>debian</option>
              <option>admin</option><option>rocky</option>
            </select></div>
          <div class="col-md-3"><button id="btnRun" class="btn btn-primary" disabled>Jalankan Ansible</button></div>
        </div>
        <div id="runBox" class="mt-3" style="display:none">
          <h4 id="runTitle"></h4>
          <pre id="runLog" class="out"></pre>
        </div>
      </div></div>
  </div></div>
</div>
</div>
<script src="/static/app.js"></script>
<script src="/static/configure.js"></script>
</body>
</html>
