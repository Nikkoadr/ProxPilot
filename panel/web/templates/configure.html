<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">

<link href="/static/custom.css?v=4" rel="stylesheet">
</head>
<body id="page-top">
<div id="wrapper">
<ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
<a class="sidebar-brand d-flex align-items-center justify-content-center" href="/"><div class="sidebar-brand-icon"><i class="fas fa-server"></i></div><div class="sidebar-brand-text mx-2">ProxPilot</div></a>
<hr class="sidebar-divider my-0">
<li class="nav-item"><a class="nav-link" href="/setup"><i class="fas fa-fw fa-plug"></i><span>Setup</span></a></li>
<li class="nav-item"><a class="nav-link" href="/clone"><i class="fas fa-fw fa-clone"></i><span>Clone VM</span></a></li>
<li class="nav-item"><a class="nav-link" href="/deploy"><i class="fas fa-fw fa-rocket"></i><span>Deploy</span></a></li>
<li class="nav-item active"><a class="nav-link" href="/configure"><i class="fas fa-fw fa-cogs"></i><span>Configure</span></a></li>
<li class="nav-item"><a class="nav-link" href="/settings"><i class="fas fa-fw fa-cog"></i><span>Settings</span></a></li>
<hr class="sidebar-divider d-none d-md-block"><div class="text-center d-none d-md-inline"><button class="rounded-circle border-0" id="sidebarToggle"></button></div>
</ul>
<div id="content-wrapper" class="d-flex flex-column"><div id="content">
<nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
<button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3"><i class="fa fa-bars"></i></button>
<ul class="navbar-nav ml-auto"><li class="nav-item"><span class="nav-link text-gray-600 small">{{.User}}</span></li>
<li class="nav-item"><a id="btnLogout" class="nav-link" href="#"><i class="fas fa-sign-out-alt"></i> <span class="d-none d-lg-inline text-gray-600 small">Logout</span></a></li></ul>
</nav>
<div class="container-fluid">
<div class="d-sm-flex align-items-center justify-content-between mb-4"><h1 class="h3 mb-0 text-gray-800"><i class="fas fa-cogs"></i> Configure (Ansible)</h1></div>
<div class="card shadow mb-4"><div class="card-header py-3 d-flex justify-content-between align-items-center">
<h6 class="m-0 font-weight-bold text-primary">1 — Pilih Host (<span id="vmCount">0 dipilih</span>)</h6>
<div class="form-inline"><label class="small text-muted mr-2">Sumber</label>
<select id="srcSel" class="form-control form-control-sm mr-2"><option value="live">Live VMs (via agent)</option></select>
<button id="btnAll" class="btn btn-sm btn-outline-primary">Semua</button>
<button id="btnNone" class="btn btn-sm btn-outline-secondary ml-1">Hapus</button></div></div>
<div class="card-body p-0"><div class="table-responsive"><table class="table table-bordered table-hover mb-0">
<thead><tr><th></th><th>VMID</th><th>Nama</th><th>Status</th><th>CPU/Mem</th><th>Uptime</th></tr></thead>
<tbody id="vmRows"><tr><td colspan="6" class="text-center text-muted">loading...</td></tr></tbody>
</table></div></div></div>
<div class="card shadow mb-4"><div class="card-header py-3"><h6 class="m-0 font-weight-bold text-info">2 — Pilih Template</h6></div>
<div class="card-body"><div id="tplRows" class="row"><div class="col-12 text-muted">loading...</div></div></div></div>
<div class="card shadow mb-4"><div class="card-header py-3"><h6 class="m-0 font-weight-bold text-secondary">3 — Jalankan</h6></div>
<div class="card-body">
<div class="form-row align-items-end">
<div class="form-group col-md-3"><label>SSH User</label><select id="sshUser" class="form-control">
<option>ubuntu</option><option>root</option><option>debian</option><option>admin</option><option>rocky</option></select></div>
<div class="form-group col-md-3"><button id="btnRun" class="btn btn-primary btn-block" disabled><i class="fas fa-play"></i> Jalankan Ansible</button></div>
</div>
<div id="runBox" class="mt-3" style="display:none"><h6 id="runTitle"></h6><div class="log-console"><pre id="runLog" class="out"></pre></div></div>
</div></div>
</div>
</div>
<footer class="sticky-footer bg-white"><div class="container my-auto"><div class="text-center my-auto"><span>ProxPilot · Ansible realtime via SSE</span></div></div></footer>
</div></div>

<script src="/static/configure.js?v=4"></script>
