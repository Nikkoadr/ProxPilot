<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProxPilot — Clone VM</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="page">
<aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
  <div class="container-fluid">
    <a href="/" class="navbar-brand"><strong>ProxPilot</strong></a>
    <div class="collapse navbar-collapse" id="sidebar-menu">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="/setup"><span class="nav-link-icon"><i class="ti ti-plug"></i></span>Setup</a></li>
        <li class="nav-item"><a class="nav-link active" href="/clone"><span class="nav-link-icon"><i class="ti ti-copy"></i></span>Clone VM</a></li>
        <li class="nav-item"><a class="nav-link" href="/configure"><span class="nav-link-icon"><i class="ti ti-settings"></i></span>Configure</a></li>
        <li class="nav-item"><a class="nav-link" href="/settings"><span class="nav-link-icon"><i class="ti ti-user-cog"></i></span>Settings</a></li>
      </ul>
    </div>
  </div>
</aside>
<div class="page-wrapper">
  <header class="navbar navbar-expand-md d-print-none">
    <div class="container-xl">
      <h1 class="navbar-brand">Clone VM <small class="text-muted" id="nodeLabel"></small></h1>
      <div class="navbar-nav ms-auto">
        <span class="nav-link text-muted">{{.User}}</span>
        <a href="#" id="btnLogout" class="nav-link"><i class="ti ti-logout"></i> Logout</a>
      </div>
    </div>
  </header>
  <div class="page-body"><div class="container-xl">
    <div class="card mb-3"><div class="card-header"><h3 class="card-title">Clone Template Baru</h3></div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-4 mb-2"><label class="form-label">Template * <span id="tplBadge"></span></label>
          <select id="cTemplate" class="form-select"><option>loading...</option></select>
          <small id="tplWarn" class="form-hint"></small></div>
        <div class="col-md-4 mb-2"><label class="form-label">VM Name *</label>
          <input id="cName" class="form-control" placeholder="app-1">
          <small class="form-hint">huruf, angka, strip. Maks 63.</small></div>
        <div class="col-md-2 mb-2"><label class="form-label">VMID</label>
          <input id="cVmid" type="number" class="form-control" placeholder="otomatis"></div>
        <div class="col-md-2 mb-2"><label class="form-label">Full clone?</label>
          <select id="cFull" class="form-select"><option value="1">Ya</option><option value="0">Linked</option></select></div>
      </div>
      <div class="row">
        <div class="col-md-2 mb-2"><label class="form-label">CPU</label><input id="cCpu" type="number" class="form-control" value="2"></div>
        <div class="col-md-2 mb-2"><label class="form-label">RAM (MB)</label><input id="cRam" type="number" class="form-control" value="4096" step="512"></div>
        <div class="col-md-2 mb-2"><label class="form-label">Disk GB (0=ikut)</label><input id="cDisk" type="number" class="form-control" value="0"></div>
        <div class="col-md-2 mb-2"><label class="form-label">Storage</label><input id="cStorage" class="form-control" value="local-lvm"></div>
        <div class="col-md-2 mb-2"><label class="form-label">Bridge</label><input id="cBridge" class="form-control" value="vmbr0"></div>
        <div class="col-md-2 mb-2"><label class="form-label">CI User</label><input id="cCiuser" class="form-control" value="ubuntu"></div>
      </div>
      <div class="row">
        <div class="col-md-3 mb-2"><label class="form-label">IP Mode</label>
          <select id="cIpMode" class="form-select"><option value="dhcp">DHCP</option><option value="static">Static</option></select></div>
        <div class="col-md-3 mb-2"><label class="form-label">Static IP</label><input id="cStaticIp" class="form-control" placeholder="192.168.1.50"></div>
        <div class="col-md-3 mb-2"><label class="form-label">Gateway</label><input id="cGateway" class="form-control" placeholder="192.168.1.1"></div>
        <div class="col-md-3 mb-2"><label class="form-label">DNS</label><input id="cDns" class="form-control" value="8.8.8.8"></div>
      </div>
      <label class="form-check"><input id="cStart" type="checkbox" class="form-check-input" checked> Start setelah clone</label>
      <div class="mt-2"><button id="btnClone" class="btn btn-primary"><i class="ti ti-copy"></i> Clone VM</button></div>
      <div id="runBox" class="mt-3" style="display:none">
        <h4 id="runTitle"></h4>
        <pre id="runLog" class="out"></pre>
      </div>
    </div></div>
    <div class="card"><div class="card-header d-flex justify-content-between">
      <h3 class="card-title">VM di Proxmox</h3>
      <button id="btnRefresh" class="btn btn-outline-secondary btn-sm">Refresh</button></div>
      <div class="table-responsive"><table class="table table-vcenter">
        <thead><tr><th>VMID</th><th>Nama</th><th>Status</th><th>CPU/Mem</th><th>Uptime</th><th>Aksi</th></tr></thead>
        <tbody id="vmRows"><tr><td colspan="6" class="text-muted">loading...</td></tr></tbody>
      </table></div>
    </div>
  </div></div>
</div>
</div>
<script src="/static/app.js"></script>
<script src="/static/clone.js"></script>
</body>
</html>
