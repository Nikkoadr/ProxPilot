<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProxPilot — Login</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/startbootstrap-sb-admin-2/4.1.4/css/sb-admin-2.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-primary">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-xl-5 col-lg-6 col-md-8">
      <div class="card o-hidden border-0 shadow-lg my-5">
        <div class="card-body p-5">
          <div class="text-center"><h1 class="h4 text-gray-900 mb-1"><i class="fas fa-server"></i> ProxPilot</h1>
          <p class="small text-muted mb-4">Proxmox Clone + Ansible</p></div>
          <div class="form-group"><input id="username" class="form-control form-control-user" value="admin" placeholder="Username"></div>
          <div class="form-group"><input id="password" type="password" class="form-control form-control-user" placeholder="Password"></div>
          <button id="btn" class="btn btn-primary btn-user btn-block">Login</button>
          <hr><div class="text-center small text-muted">Default: <code>admin / admin123</code></div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="/static/vendor/jquery.min.js"></script>
<script src="/static/vendor/bootstrap.bundle.min.js"></script>
<script src="/static/vendor/sweetalert2.min.js"></script>
<script>
document.getElementById('btn').onclick = async () => {
  try {
    const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username: document.getElementById('username').value,
        password: document.getElementById('password').value})});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    location.href = '/';
  } catch(e) { Swal.fire('Gagal', e.message, 'error'); }
};
document.getElementById('password').onkeydown = e => { if (e.key === 'Enter') document.getElementById('btn').click(); };
</script>
</body>
</html>
