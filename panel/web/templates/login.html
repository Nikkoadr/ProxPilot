<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProxPilot — Login</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
</head>
<body class="d-flex flex-column">
<div class="page page-center">
  <div class="container container-tight py-4">
    <div class="text-center mb-4"><h1>ProxPilot</h1><p class="text-muted">Proxmox Clone + Ansible</p></div>
    <div class="card card-md">
      <div class="card-body">
        <h2 class="h2 text-center mb-4">Login</h2>
        <div class="mb-3"><label class="form-label">Username</label>
          <input id="username" class="form-control" value="admin" autocomplete="username"></div>
        <div class="mb-3"><label class="form-label">Password</label>
          <input id="password" type="password" class="form-control" autocomplete="current-password"></div>
        <div id="err" class="text-danger mb-2"></div>
        <button id="btn" class="btn btn-primary w-100">Login</button>
      </div>
    </div>
    <div class="text-center text-muted mt-3">Default: <code>admin / admin123</code></div>
  </div>
</div>
<script>
document.getElementById('btn').onclick = async () => {
  const err = document.getElementById('err'); err.textContent = '';
  try {
    const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username: document.getElementById('username').value,
        password: document.getElementById('password').value})});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    location.href = '/';
  } catch(e) { err.textContent = e.message; }
};
document.getElementById('password').onkeydown = e => { if (e.key === 'Enter') document.getElementById('btn').click(); };
</script>
</body>
</html>
