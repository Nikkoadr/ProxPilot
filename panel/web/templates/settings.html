<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProxPilot — Settings</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/startbootstrap-sb-admin-2/4.1.4/css/sb-admin-2.min.css" rel="stylesheet">
<link href="/static/custom.css?v=4" rel="stylesheet">
</head>
<body id="page-top">
<div id="wrapper">
<ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">
<a class="sidebar-brand d-flex align-items-center justify-content-center" href="/"><div class="sidebar-brand-icon"><i class="fas fa-server"></i></div><div class="sidebar-brand-text mx-2">ProxPilot</div></a>
<hr class="sidebar-divider my-0">
<li class="nav-item"><a class="nav-link" href="/setup"><i class="fas fa-fw fa-plug"></i><span>Setup</span></a></li>
{{if .SetupComplete}}
<li class="nav-item"><a class="nav-link" href="/clone"><i class="fas fa-fw fa-clone"></i><span>Clone VM</span></a></li>
<li class="nav-item"><a class="nav-link" href="/deploy"><i class="fas fa-fw fa-rocket"></i><span>Deploy</span></a></li>
<li class="nav-item"><a class="nav-link" href="/configure"><i class="fas fa-fw fa-cogs"></i><span>Configure</span></a></li>
{{end}}
<li class="nav-item active"><a class="nav-link" href="/settings"><i class="fas fa-fw fa-cog"></i><span>Settings</span></a></li>
<hr class="sidebar-divider d-none d-md-block"><div class="text-center d-none d-md-inline"><button class="rounded-circle border-0" id="sidebarToggle"></button></div>
</ul>
<div id="content-wrapper" class="d-flex flex-column"><div id="content">
<nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
<button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3"><i class="fa fa-bars"></i></button>
<ul class="navbar-nav ml-auto"><li class="nav-item"><span class="nav-link text-gray-600 small">{{.User}}</span></li>
<li class="nav-item"><a id="btnLogout" class="nav-link" href="#"><i class="fas fa-sign-out-alt"></i> <span class="d-none d-lg-inline text-gray-600 small">Logout</span></a></li></ul>
</nav>
<div class="container-fluid">
<div class="d-sm-flex align-items-center justify-content-between mb-4"><h1 class="h3 mb-0 text-gray-800"><i class="fas fa-cog"></i> Settings</h1></div>
<div class="card shadow mb-4 col-lg-6"><div class="card-header py-3"><h6 class="m-0 font-weight-bold text-primary">Ganti Password</h6></div>
<div class="card-body">
<div class="form-group"><label>Password lama</label><input id="oldpw" type="password" class="form-control"></div>
<div class="form-group"><label>Password baru (min 6)</label><input id="newpw" type="password" class="form-control"></div>
<button id="btnPw" class="btn btn-primary btn-sm">Ganti</button>
</div></div>
</div>
</div>
<footer class="sticky-footer bg-white"><div class="container my-auto"><div class="text-center my-auto"><span>ProxPilot</span></div></div></footer>
</div></div>
<a class="scroll-to-top rounded" href="#page-top"><i class="fas fa-angle-up"></i></a>
<script src="/static/vendor/jquery.min.js"></script>
<script src="/static/vendor/bootstrap.bundle.min.js"></script>
<script src="/static/vendor/jquery.easing.min.js"></script>
<script src="/static/vendor/sb-admin-2.min.js"></script>
<script src="/static/vendor/sweetalert2.min.js"></script>
<script src="/static/app.js?v=4"></script>
<script>
document.getElementById('btnPw').onclick = async () => {
  try {
    const r = await apiPost('/api/user/password', {old_password: val('oldpw'), new_password: val('newpw')});
    toast('success', r.message || 'Password diganti');
    setTimeout(() => location.href = '/login', 1500);
  } catch(e) { Swal.fire('Gagal', e.message, 'error'); }
};
</script>
</body>
</html>
