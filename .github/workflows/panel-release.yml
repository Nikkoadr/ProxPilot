name: panel-release

on:
  push:
    tags:
      - "panel-v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      # Gagal berisik kalau binary tidak ada (bukan hijau palsu).
      - name: Verify binary
        run: ls -lh target/release/proxmox-panel && file target/release/proxmox-panel

      # gh langsung (preinstalled di runner): gagal berisik kalau file hilang,
      # --clobber menimpa asset saat re-run.
      # Catatan: `file#nama` di gh hanya mengisi LABEL, bukan nama asset —
      # jadi rename via cp dulu agar browser_download_url benar.
      - name: Upload asset to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/release/proxmox-panel ./proxmox-panel-linux-x86_64
          gh release upload "${{ github.ref_name }}" ./proxmox-panel-linux-x86_64 --clobber
