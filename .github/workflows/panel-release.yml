name: panel-release

on:
  push:
    tags:
      - "panel-v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: panel/go.sum

      - name: Build release
        run: CGO_ENABLED=0 go build -buildvcs=false -o proxpilot-linux-x86_64 .
        env:
          GOFLAGS: -mod=mod

      # Gagal berisik kalau binary tidak ada (bukan hijau palsu).
      - name: Verify binary
        run: ls -lh proxpilot-linux-x86_64 && file proxpilot-linux-x86_64

      # gh langsung (preinstalled di runner): gagal berisik kalau file hilang,
      # --clobber menimpa asset saat re-run.
      - name: Upload asset to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" ./proxpilot-linux-x86_64 --clobber
